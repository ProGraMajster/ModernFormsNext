version = 1
name = "ModernFormsNext"

[setup]
script = ""

[setup.linux]
script = '''
set -euo pipefail

cd "$CODEX_WORKTREE_PATH"

export DOTNET_ROOT="$HOME/.dotnet"
export PATH="$DOTNET_ROOT:$PATH"

grep -qxF 'export DOTNET_ROOT="$HOME/.dotnet"' ~/.bashrc || echo 'export DOTNET_ROOT="$HOME/.dotnet"' >> ~/.bashrc
grep -qxF 'export PATH="$DOTNET_ROOT:$PATH"' ~/.bashrc || echo 'export PATH="$DOTNET_ROOT:$PATH"' >> ~/.bashrc

if ! command -v dotnet >/dev/null 2>&1 || ! dotnet --list-sdks | grep -q '^10\.'; then
    curl -fsSL https://dot.net/v1/dotnet-install.sh -o /tmp/dotnet-install.sh
    chmod +x /tmp/dotnet-install.sh
    /tmp/dotnet-install.sh --channel 10.0 --install-dir "$DOTNET_ROOT"
fi

dotnet --info

sln="$(find . -maxdepth 2 -name "*.sln" | head -n 1)"

if [ -z "$sln" ]; then
    echo "Nie znaleziono pliku .sln"
    exit 1
fi

dotnet restore "$sln"

dotnet build "$sln" \
    -c Debug \
    --no-restore \
    /p:ContinuousIntegrationBuild=true \
    /p:EnableWindowsTargeting=true
'''

[setup.win32]
script = '''
$ErrorActionPreference = "Stop"

$repo = if ($env:CODEX_WORKTREE_PATH) { $env:CODEX_WORKTREE_PATH } else { (Get-Location).Path }
Set-Location $repo

$env:DOTNET_CLI_TELEMETRY_OPTOUT = "1"
$env:DOTNET_NOLOGO = "1"
$env:DOTNET_SKIP_FIRST_TIME_EXPERIENCE = "1"
$env:NUGET_XMLDOC_MODE = "skip"

Write-Host "== ModernFormsNext Codex setup =="
Write-Host "Repo: $repo"

dotnet --info

$requiredSdk = "10.0.201"
$sdks = dotnet --list-sdks

if (-not ($sdks -match "^$requiredSdk\s")) {
    Write-Host ""
    Write-Host "Zainstalowane SDK:"
    $sdks
    throw "Brakuje .NET SDK $requiredSdk. Repo ma global.json ustawione na 10.0.201."
}

dotnet restore .\ModernFormsNext.slnx --force --no-cache

dotnet build .\ModernFormsNext.slnx `
    --configuration Debug `
    --no-restore `
    --verbosity normal `
    /p:EnableWindowsTargeting=true

Write-Host "ModernFormsNext setup OK."
'''

