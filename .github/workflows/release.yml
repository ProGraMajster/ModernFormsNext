name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  id-token: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.201

      - name: .NET Info
        run: dotnet --info

      - name: Restore
        run: dotnet restore ModernFormsNext.slnx --force --no-cache

      - name: Build
        run: dotnet build ModernFormsNext.slnx --configuration Release --no-restore --verbosity normal -m:1 /p:UseSharedCompilation=false

      - name: Pack
        run: dotnet pack ModernFormsNext.slnx --configuration Release --no-build --output artifacts/packages

      - name: Create GitHub Release
        shell: pwsh
        run: |
          gh release create "${{ github.ref_name }}" `
            artifacts/packages/*.nupkg `
            artifacts/packages/*.snupkg `
            --title "ModernFormsNext ${{ github.ref_name }}" `
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}

      - name: NuGet login
        uses: NuGet/login@v1
        id: login
        with:
          user: ProGraMajster

      - name: Publish to NuGet
        shell: pwsh
        run: |
          Get-ChildItem artifacts/packages -Filter *.nupkg | ForEach-Object {
            dotnet nuget push $_.FullName `
              --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" `
              --source "https://api.nuget.org/v3/index.json" `
              --skip-duplicate
          }
