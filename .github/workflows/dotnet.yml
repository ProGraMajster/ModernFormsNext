name: .NET

on:
  # Keep the default PR activity types and validate again when a PR changes base.
  # Required build checks also cover documentation PRs, so keep branch filters only.
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches:
      - master
      - develop/2.0.0

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # Both protected branches require the build context with strict base freshness.
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # The default PR checkout is its merge revision. Local Git avoids API
          # pagination/file limits and includes both sides of renames/deletions.
          fetch-depth: 0

      - name: Validate workflow syntax and expression contexts
        shell: pwsh
        run: ./scripts/Test-WorkflowSyntax.ps1

      - name: Classify changes
        id: changes
        shell: pwsh
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          MERGE_SHA: ${{ github.sha }}
        run: ./scripts/Get-CiChanges.ps1 -BaseCommit $env:BASE_SHA -HeadCommit $env:MERGE_SHA

      - name: Test CI change classification
        shell: pwsh
        run: ./scripts/tests/Test-CiChanges.ps1

      - name: Validate changed documentation
        if: steps.changes.outputs.full == 'false'
        shell: pwsh
        run: ./scripts/Test-CiDocumentation.ps1

      - name: Test release documentation scripts
        shell: pwsh
        run: ./scripts/tests/Test-ReleaseDocumentation.ps1

      - name: Test release package scripts
        shell: pwsh
        run: ./scripts/tests/Test-ReleasePackages.ps1

      - name: Test release evidence gates
        shell: pwsh
        run: ./scripts/tests/Test-ReleaseEvidence.ps1

      - name: Test release handoff provenance
        shell: pwsh
        run: ./scripts/tests/Test-ReleaseHandoff.ps1

      - name: Test Designer startup collector evidence and fixture context
        shell: pwsh
        run: ./scripts/tests/Test-DesignerStartup.ps1

      - name: Setup .NET
        if: steps.changes.outputs.full != 'false'
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
          dotnet-version: '11.0.100'

      - name: .NET Info
        if: steps.changes.outputs.full != 'false'
        run: dotnet --info

      - name: Setup Java
        if: steps.changes.outputs.full != 'false'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        if: steps.changes.outputs.full != 'false'
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Install Android workload
        if: steps.changes.outputs.full != 'false'
        run: dotnet workload install android --version 10.0.401.1

      - name: Restore
        if: steps.changes.outputs.full != 'false'
        # Normal NuGet caches are permitted on this runner. Persisting the full
        # package folder across PR runs was slower overall; see the measured audit.
        run: dotnet restore ModernFormsNext.slnx

      - name: Build
        if: steps.changes.outputs.full != 'false'
        # Parallel build/test qualification is incomplete; retain the policy in docs/ci.md.
        run: dotnet build ModernFormsNext.slnx --configuration Release --no-restore --verbosity normal -m:1 /p:UseSharedCompilation=false

      - name: Compile control documentation examples
        if: steps.changes.outputs.full != 'false'
        shell: pwsh
        run: ./scripts/Test-ControlDocumentation.ps1

      - name: Regression tests (including high DPI and native partial presentation)
        if: steps.changes.outputs.full != 'false'
        run: dotnet test ModernFormsNext.slnx --configuration Release --no-build --no-restore -m:1 /p:UseSharedCompilation=false --logger "trx;LogFilePrefix=ci"

      - name: Pack and inspect candidate packages
        if: steps.changes.outputs.full != 'false'
        shell: pwsh
        run: |
          dotnet pack ModernFormsNext.slnx -c Release --no-build -m:1 -o artifacts/ci/compat-packages
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          ./scripts/Validate-ReleasePackages.ps1 -PackageDirectory artifacts/ci/compat-packages

      - name: Windows NuGet and template consumers (.NET 10 and 11)
        if: steps.changes.outputs.full != 'false'
        shell: pwsh
        run: |
          foreach ($major in 10, 11) {
            ./scripts/Test-WindowsPackageConsumer.ps1 -RuntimeMajor $major -PackageDirectory artifacts/ci/compat-packages -OutputDirectory "artifacts/ci/consumer-$major"
          }

      - name: Focused native Windows regression on .NET 11
        if: steps.changes.outputs.full != 'false'
        shell: pwsh
        env:
          DOTNET_ROLL_FORWARD: LatestMajor
          DOTNET_TEST_RUNNER: VSTest
        run: |
          $project = (Resolve-Path ModernFormsNext.WindowKit.Backend.Windows.Tests/ModernFormsNext.WindowKit.Backend.Windows.Tests.csproj).Path
          $results = Join-Path $PWD 'artifacts/ci/runtime-11'
          $filter = 'FullyQualifiedName~WindowsNativeApplicationLifecycleTests|FullyQualifiedName~WindowsNativeComboDisposalTests|FullyQualifiedName~WindowsNativeDpiChangedTests|FullyQualifiedName~WindowsNativePerformanceTests|FullyQualifiedName~WindowsTextInputIntegrationTests|FullyQualifiedName~WindowsKeyboardInputTests'
          # Use the SDK 11 pin created by the consumer check. Rolling the
          # existing Release test and child host to CLR 11 reuses the same binaries.
          Push-Location artifacts/ci/consumer-11
          try {
            dotnet test $project -c Release --no-build --no-restore --filter $filter --results-directory $results --logger 'trx;LogFileName=windows-net11.trx' -- RunConfiguration.TreatNoTestsAsError=true
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally { Pop-Location }

      - name: Retain Windows compatibility evidence
        if: always() && steps.changes.outputs.full != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: windows-runtime-compatibility
          path: |
            artifacts/ci/consumer-*/*.log
            artifacts/ci/consumer-*/result.json
            artifacts/ci/runtime-11/*.trx
          if-no-files-found: ignore

      - name: DynamicResource JIT and trimmed deployment
        if: steps.changes.outputs.full != 'false'
        shell: pwsh
        run: ./scripts/Test-DynamicResourcePublish.ps1 -OutputRoot artifacts/ci/dynamic-resource-publish

      - name: Retain DynamicResource deployment diagnostics
        if: always() && steps.changes.outputs.full != 'false'
        uses: actions/upload-artifact@v4
        with:
          name: dynamic-resource-deployment-diagnostics
          path: |
            artifacts/ci/dynamic-resource-publish/*.log
            artifacts/ci/dynamic-resource-publish/result.json
          if-no-files-found: ignore
