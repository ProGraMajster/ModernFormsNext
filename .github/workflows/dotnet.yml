name: .NET

on:
  push:
    branches: [ "master" ]
  pull_request:
    branches: [ "master" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore ModernFormsNext.slnx

      - name: Build
        run: dotnet build ModernFormsNext.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test ModernFormsNext.slnx --configuration Release --no-build --verbosity normal
